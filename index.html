<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Albion Craft — kalkulator materiałów</title>
<style>
:root{color-scheme:dark;--bg:#0b1018;--panel:#171f2d;--line:#303d50;--gold:#e9b96b;--text:#f2f4f8;--muted:#98a8bd}
*{box-sizing:border-box}html{min-height:100%;background:var(--bg)}body{margin:0;min-height:100vh;color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:radial-gradient(ellipse 85% 460px at 50% -190px,#374054 0%,transparent 85%),linear-gradient(180deg,#111a27 0%,#0b1018 60%)}main{max-width:840px;margin:0 auto;padding:42px 20px 70px}
h1{margin:0;font-size:clamp(29px,5vw,39px);font-weight:800;letter-spacing:-1.3px;color:#f1c780;text-shadow:0 2px 20px #e4aa4730}.subtitle{color:#a6b3c5;font-size:13px;margin:1px 0 27px;letter-spacing:.08em;text-transform:uppercase}
section{position:relative;background:linear-gradient(145deg,#1b2636,#151d2a);border:1px solid #334256;border-radius:18px;padding:25px 27px;margin:17px 0;box-shadow:0 14px 40px #00000026}h2{font-size:19px;margin:0 0 10px;font-weight:750;letter-spacing:-.3px}label{display:block;color:#c4cfdf;font-size:13px;font-weight:650;margin:17px 0 7px}
input:not([type=checkbox]){display:block;width:100%;min-width:0;border:1px solid #3c4c62;border-radius:11px;background:#101824;color:#f5f6fa;font:inherit;font-size:16px;padding:13px 15px;transition:border-color .15s,box-shadow .15s}input:focus-visible{outline:0;border-color:#d5a65b;box-shadow:0 0 0 3px #d5a65b2b}input::placeholder{color:#71829a}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.search-list{max-height:270px;overflow-y:auto;border-radius:11px;margin-top:6px}.search-list:empty{display:none}.item{width:100%;display:flex;align-items:center;gap:12px;padding:9px 11px;border:0;border-bottom:1px solid #344153;background:#101925;color:#eef2f8;text-align:left;font:inherit;cursor:pointer}.item:hover,.item:focus-visible{background:#28394f}.item img{width:45px;height:45px;object-fit:contain}
.chosen{display:flex;align-items:center;gap:13px;margin:15px 0 2px;background:#111b28;border:1px solid #344459;border-radius:12px;padding:11px}.chosen img{width:60px;height:60px;object-fit:contain}.chosen b{color:#f3cf8d}.muted{color:var(--muted)}#itemId{font-size:11px;opacity:.65}
.toggle{display:flex;align-items:center;gap:11px;margin:18px 0 3px;cursor:pointer;width:max-content}.toggle input{width:18px;height:18px;accent-color:#e0b16a;cursor:pointer}.btn{display:block;width:100%;margin-top:17px;padding:14px 18px;border:0;border-radius:11px;background:linear-gradient(135deg,#f3cb82,#d8a050);color:#221809;font:inherit;font-size:16px;font-weight:800;cursor:pointer;box-shadow:0 5px 20px #d9a45021;transition:filter .15s,transform .15s}.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}.btn:active{transform:translateY(0)}.status{font-size:12px;color:#a5b3c7;margin:12px 1px 0}
#materials:empty{display:none}.mat{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:13px;align-items:center;padding:13px 2px;border-bottom:1px solid #303d50}.mat:last-child{border-bottom:0}.mat img{width:50px;height:50px;object-fit:contain;background:#111b29;border-radius:10px}.mat .name{min-width:0;overflow-wrap:anywhere}.mat b{font-size:14px;font-weight:650}.mat small{display:block;margin-top:3px;font-size:11px;color:#899bb2}.mat strong{color:#f1c77d;font-size:19px;white-space:nowrap;font-variant-numeric:tabular-nums}.help{font-size:12px;line-height:1.6;color:#8494a9;margin:15px 0 0}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.summary>div{background:#101924;padding:12px;border-radius:10px}.summary strong{display:block;color:var(--gold)}.hidden{display:none!important}
@media(max-width:600px){main{padding:24px 13px 45px}section{padding:19px 16px;border-radius:15px}.grid{grid-template-columns:1fr;gap:0}.mat{grid-template-columns:43px minmax(0,1fr) auto;gap:9px}.mat img{width:42px;height:42px}.mat strong{font-size:16px}.subtitle{margin-bottom:20px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><main>
<h1>⚒ Albion Craft</h1><p class="subtitle">Crafting calculator</p>
<section><label for="search">Przedmiot</label><input id="search" placeholder="np. Demonfang 4.2" autocomplete="off"><div id="results" class="search-list"></div>
<div id="selected" class="chosen hidden"><img id="itemImage" alt=""><div><b id="itemLabel"></b><div class="muted" id="itemId"></div></div></div>
<div class="grid"><div><label for="quantity">Ilość</label><input id="quantity" type="number" min="1" step="1" value="100"></div><div><label for="rrr">Zwrot materiałów (%)</label><input id="rrr" type="number" min="0" max="99" step="0.1" value="36.7"></div></div>
<label class="toggle"><input type="checkbox" id="premium" checked> Premium</label>
<button id="calculate" class="btn">Oblicz</button><p id="status" class="status">Ładowanie receptur…</p></section>
<section><h2>Materiały</h2><p id="summary" class="muted">Wybierz przedmiot.</p><div id="totals" class="summary hidden"></div><div id="materials"></div><p class="help">Wyniki uwzględniają podany zwrot. To szacunkowe zużycie, nie gwarantowana ilość zakupów.</p></section>
</main><script>
'use strict';
const $=id=>document.getElementById(id);
const namesURL='https://raw.githubusercontent.com/ao-data/ao-bin-dumps/master/formatted/items.json';
const recipesURL='https://raw.githubusercontent.com/ao-data/ao-bin-dumps/master/items.json';
const imageBase='https://render.albiononline.com/v1/item/';
let names=[],recipes=new Map(),chosen=null;
const arr=x=>!x?[]:Array.isArray(x)?x:[x];
const idOf=x=>x?.UniqueName||x?.uniqueName||x?.['@uniquename']||x?.id||'';
const nameOf=x=>x?.LocalizedNames?.['EN-US']||x?.LocalizedNames?.['en-US']||x?.name||idOf(x);
const tier=id=>Number(id.match(/^T(\d+)_/)?.[1]||0);
const enchant=id=>Number(id.match(/@(\d+)$/)?.[1]||0);
const norm=x=>String(x||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
const showName=x=>x.name.replace(/^(Beginner's|Novice's|Journeyman's|Adept's|Expert's|Master's|Grandmaster's|Elder's)\s+/i,'')+' '+tier(x.id)+'.'+enchant(x.id);
const fmt=n=>Math.ceil(n).toLocaleString('pl-PL');
const icon=id=>imageBase+encodeURIComponent(id)+'.png?quality=1&size=96';
function setIcon(el,id){el.onerror=()=>{el.onerror=null;el.style.opacity='.2'};el.style.opacity='1';el.src=icon(id)}
function parseRecipe(r){
 const candidates=[];
 function walk(x,depth=0){if(!x||depth>7)return;if(Array.isArray(x)){for(const y of x)walk(y,depth+1);return}if(typeof x!=="object")return;
 const resources=arr(x.craftresource||x.CraftResource||x.resources||x.resource);
 if(resources.length){const parsed=resources.map(m=>{let id=m?.['@uniquename']||m?.uniquename||m?.UniqueName||m?.id||'';const lv=Number(m?.['@enchantmentlevel']||0);if(lv&&!id.includes('@'))id+='@'+lv;return{id,qty:Number(m?.['@count']??m?.count??m?.Count??0),returnable:String(m?.['@maxreturnamount']??'1')!=='0'}});if(parsed.length&&parsed.every(m=>m.id&&m.qty>0))candidates.push(parsed)}
 for(const [k,v] of Object.entries(x))if(k!=='craftresource'&&k!=='CraftResource'&&k!=='resources'&&k!=='resource')walk(v,depth+1);
 }walk(r);return candidates[0]||null;
}
function addRecipes(raw){
 let count=0;const visit=(node,depth=0)=>{if(!node||depth>9)return;if(Array.isArray(node)){for(const x of node)visit(x,depth+1);return}if(typeof node!=='object')return;
 const id=idOf(node);if(id&&/^T[1-8]_/.test(id)){
 const base=parseRecipe(node.craftingrequirements||node.CraftingRequirements||node.craftingRequirements);
 if(base){recipes.set(id,base);count++}
 for(const e of arr(node.enchantments?.enchantment||node.enchantments?.Enchantment)){
 const lv=Number(e?.['@enchantmentlevel']??e?.enchantmentlevel??e?.level);const mats=parseRecipe(e?.craftingrequirements||e?.CraftingRequirements);
 if(lv&&mats){recipes.set(id+'@'+lv,mats);count++}}
 }
 if(depth<9)for(const [k,v] of Object.entries(node))if(k!=='craftingrequirements'&&k!=='CraftingRequirements'&&k!=='craftingRequirements')visit(v,depth+1);
 };visit(raw);return count;
}

async function getJSON(url){const r=await fetch(url);if(!r.ok)throw Error('HTTP '+r.status);return r.json()}
async function load(){try{const [a,b]=await Promise.all([getJSON(namesURL),getJSON(recipesURL)]);addRecipes(b);const raw=Array.isArray(a)?a:a.items||[];names=raw.map(x=>({id:idOf(x),name:nameOf(x)})).filter(x=>x.id&&tier(x.id)>=4);$('status').textContent='Gotowe — wybierz przedmiot. Receptury: '+recipes.size.toLocaleString('pl-PL')+'.';if($('search').value.trim())search()}catch(e){$('status').textContent='Nie udało się pobrać katalogu: '+e.message+'. Odśwież stronę.'}}
function search(){const raw=$('search').value.trim(),out=$('results');out.replaceChildren();if(raw.length<2)return;const match=raw.match(/(?:^|\s)([1-8])\.([0-4])\s*$/),t=match?Number(match[1]):null,e=match?Number(match[2]):null,q=norm(match?raw.slice(0,match.index):raw);if(!q)return;const candidates=names.filter(x=>(t===null||tier(x.id)===t)&&(norm(x.name).includes(q)||norm(x.id).includes(q)));const found=[];const seen=new Set();for(const x of candidates){const id=e!==null&&e>0?x.id.replace(/@\d+$/,'')+'@'+e:x.id;if(e===0&&enchant(x.id)!==0)continue;if(!recipes.has(id)||seen.has(id))continue;seen.add(id);found.push({...x,id});}found.sort((a,b)=>Number(norm(b.name).startsWith(q))-Number(norm(a.name).startsWith(q)));for(const x of found.slice(0,35)){const btn=document.createElement('button');btn.className='item';const im=document.createElement('img');setIcon(im,x.id);im.loading='lazy';const label=document.createElement('span');label.textContent=showName(x);btn.append(im,label);btn.onclick=()=>{chosen=x;$('search').value=showName(x);out.replaceChildren();$('selected').classList.remove('hidden');$('itemLabel').textContent=showName(x);$('itemId').textContent=x.id;setIcon($('itemImage'),x.id);calculate()};out.append(btn)}if(!found.length)out.textContent='Brak receptury dla tego przedmiotu. Spróbuj innej nazwy.'}
function calculate(){if(!chosen){$('status').textContent='Wybierz przedmiot z listy.';return}const recipe=recipes.get(chosen.id);if(!recipe){$('status').textContent='Brak receptury dla '+chosen.id;return}const quantity=Math.max(1,Math.floor(Number($('quantity').value)||1));const rrr=Math.min(99,Math.max(0,Number($('rrr').value)||0))/100;const out=$('materials');out.replaceChildren();let grossTotal=0,netTotal=0;for(const m of recipe){const gross=m.qty*quantity,net=m.returnable?Math.max(m.qty,Math.ceil(gross*(1-rrr))):gross;grossTotal+=gross;netTotal+=net;const row=document.createElement('div');row.className='mat';const im=document.createElement('img');setIcon(im,m.id);const desc=document.createElement('div');desc.className='name';const title=document.createElement('b');title.textContent=names.find(x=>x.id===m.id)?.name||m.id;const small=document.createElement('small');small.textContent='Bez zwrotu: '+fmt(gross)+' · Pierwszy craft: '+fmt(m.qty);desc.append(title,small);const count=document.createElement('strong');count.textContent=fmt(net)+' szt.';row.append(im,desc,count);out.append(row)}$('summary').textContent=showName(chosen)+' · '+quantity+' szt. · '+(rrr*100).toFixed(1)+'% zwrotu';$('totals').classList.add('hidden');$('totals').replaceChildren();$('status').textContent='Gotowe'}
$('search').addEventListener('input',search);$('calculate').addEventListener('click',calculate);$('quantity').addEventListener('input',()=>{if(chosen)calculate()});$('rrr').addEventListener('input',()=>{if(chosen)calculate()});load();
</script></body></html>
